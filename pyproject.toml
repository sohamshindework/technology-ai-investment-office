[project]
name = "technology-ai-investment-strategy"
version = "0.2.0"
description = "Technology & AI Investment Strategy: Portfolio Optimization, Financial Modeling, Scenario Planning."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<4", "pyyaml>=6,<7", "ortools>=9.10,<10",
  "streamlit>=1.50,<2", "plotly>=6,<8", "pydantic>=2.14,<3", "pypdf>=6.21,<7",
  "xlsxwriter>=3.3,<4", "reportlab>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invest_engine"]
