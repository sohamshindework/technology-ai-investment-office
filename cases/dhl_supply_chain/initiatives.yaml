- id: INT_LAYER
  library_ref: L-IT-01
  name: Extend the robotics integration layer to more sites
  function: IT / Operations
  status: scale
  description: 'Roll the vendor-neutral robotics integration layer out beyond the
    sites where it is live, so new robots and automation connect to the warehouse
    management system without custom code.

    '
  public_basis: Live at 30 sites; DHL plans >100 sites within three years; integrations
    up to 12x faster.
  sources:
  - S4
  site_options:
  - 20
  - 40
  - 70
  capex_per_site:
  - 80
  - 150
  - 250
  opex_per_site:
  - 30
  - 50
  - 80
  benefit_per_site:
  - 60
  - 110
  - 180
  months_to_value:
  - 1
  - 2
  - 4
  ramp_years: 0.5
  p_success: 0.95
  fail_benefit_share: 0.5
  fte_per_site: 0.15
  central_fte: 1.0
  kpi: Integration lead time per new automation (weeks)
  ai_act:
    uses_ai: false
    emotion_recognition_workplace: false
    biometric_categorisation_sensitive: false
    recruitment_selection: false
    allocates_tasks_individual_behaviour: false
    monitors_evaluates_workers: false
    decisions_on_work_terms: false
    safety_component_regulated_product: false
    interacts_with_people: false
    generates_synthetic_content: false
    uses_gpai_model: false
    capable_of_monitoring_employees: false
    processes_personal_data: false
  assumption_notes: 'Benefit = avoided custom integration work and faster changes.
    Enabler: its main value is unlocking the robotics and orchestration rollouts that
    depend on it.

    '
