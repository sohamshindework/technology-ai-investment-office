  operating_unit: Contract logistics division
  geography: Illustrative eligible Supply Chain sites; no approved site list
  process: Warehouse automation and operations
  beneficiary: DHL Supply Chain, subject to customer contract sharing
  exclusions:
    - DHL Group-wide capital allocation
    - Freight, Express and Post divisions
