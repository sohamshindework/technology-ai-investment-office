schema_version: 1
case_id: bmw_group
industry_id: automotive
scope:
  company: BMW Group
  operating_unit: Hypothetical eligible German vehicle-production line workflows
  geography: Germany; representative eligible workflows, not the entire production network
  process: Assembly, paint, maintenance, quality and line planning
  beneficiary: Hypothetical production operating unit, subject to finance and plant-owner confirmation
  exclusions:
    - BMW Group-wide capital allocation
    - Autonomous safety-critical machine control
    - Product-release decisions without human authority
    - Production-network or machine-hour optimization
as_of: '2026-11-14'
deployment_unit:
  singular: line-workflow deployment
  plural: line-workflow deployments
  definition: One initiative introduced to one eligible production-line workflow; multiple initiatives may share a line and no plant count is implied.
  coverage_noun: line workflows
accent:
  primary: '#496E83'
  support: '#829AA8'
kpis:
  - id: downtime
    initiative_ids: [PRED_MAINT]
    label: Unplanned conveyor downtime
    unit: hours
    direction: lower
    frequency: monthly
    aggregation: sum
    provenance: hypothetical_assumption
    source_ids: [B2]
    owner: Unknown; plant maintenance owner required
    baseline: null
    target: null
  - id: first_pass_yield
    initiative_ids: [VISION_QA, DEFECT_TRACE]
    label: First-pass quality yield
    unit: percent_0_100
    direction: higher
    frequency: monthly
    aggregation: ratio_of_totals
    numerator: accepted_first_pass
    denominator: inspected_vehicles
    provenance: hypothetical_assumption
    source_ids: [B1, B7]
    owner: Unknown; plant quality owner required
    baseline: null
    target: null
  - id: rework_cost
    initiative_ids: [VISION_QA, PAINT_QA]
    label: Direct rework cost per affected vehicle
    unit: EUR/vehicle
    direction: lower
    frequency: monthly
    aggregation: ratio_of_totals
    numerator: direct_rework_cost_eur
    denominator: affected_vehicles
    provenance: hypothetical_assumption
    source_ids: [B3, B6]
    owner: Unknown; quality finance owner required
    baseline: null
    target: null
  - id: availability
    initiative_ids: [PRED_MAINT]
    label: Conveyor equipment availability
    unit: percent_0_100
    direction: higher
    frequency: monthly
    aggregation: ratio_of_totals
    numerator: available_scheduled_minutes
    denominator: scheduled_minutes
    provenance: hypothetical_assumption
    source_ids: [B2]
    owner: Unknown; maintenance owner required
    baseline: null
    target: null
  - id: planning_cycle
    initiative_ids: [PLAN_TWIN, SCHED_ANALYTICS]
    label: Line-change planning cycle
    unit: days
    direction: lower
    frequency: quarterly
    aggregation: mean
    provenance: hypothetical_assumption
    source_ids: [B4]
    owner: Unknown; production planning owner required
    baseline: null
    target: null
