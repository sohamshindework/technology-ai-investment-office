    unit: kWh/vehicle
    direction: lower
    frequency: monthly
    aggregation: ratio_of_totals
    numerator: metered_process_kwh
    denominator: completed_vehicles
    provenance: hypothetical_assumption
    source_ids: [B6]
    owner: Unknown; plant energy owner required
    baseline: null
    target: null
governance:
  profile_id: manufacturing_operations_v1
  profile_version: 1
  coverage_review: design_reviewed
  domains: [machine_safety, quality, workplace, privacy, human_oversight, cybersecurity, vendor_assurance]
  approval_points:
    - Plant engineering and production owners confirm eligible workflows, change windows and machine-safety boundaries.
    - Quality owners validate defect baselines, inspection accuracy and human product-release authority.
    - Workforce and privacy owners review monitoring, training and consultation before deployment.
    - Industrial cybersecurity and vendor owners approve data paths and operational resilience.
    - Pilot-gated automation and paint candidates need local evidence and explicit committee approval.
views:
  portfolio: [contribution, baseline_waterfall, function_value, manufacturing_kpi_scorecard]
  scenarios: [capital_frontier, npv_distribution, scenario_delta]
  delivery: [quarterly_rollout, quarterly_capacity, planned_benefits]
decision_notes:
  rationale: Prioritize attributable maintenance, quality and planning value on eligible lines after confirming current BMW capability coverage.
  risks:
    - Public examples do not establish this hypothetical unit's existing tool coverage, remaining defect pool or downtime cost.
    - Downtime, scheduling and diagnosis savings overlap unless separate event and labor pools are measured.
    - Quality, machine-safety, workforce and industrial cyber reviews are required before deployment.
  approval_points:
    - Confirm line eligibility, current capability coverage, downtime/defect baselines and retained cash benefit.
    - Validate mutually exclusive event, rework, labor and energy benefit pools with plant finance.
    - Approve engineering capacity, pilot evidence, safety, quality, workforce and cyber gates.
  source_ids: [B1, B2, B3, B4, B5, B7]
