facts:
  - label: Existing production AI
    value: BMW Group describes hundreds of AI use cases in series production and its AIQX quality platform.
    source: B1
  - label: Existing predictive maintenance
    value: BMW reports AI-supported conveyor monitoring at Plant Regensburg and approximately 500 minutes of annual assembly disruption avoided there.
    source: B2
  - label: Existing inspection pilot
    value: BMW describes GenAI4Q tailored quality-check recommendations at Plant Regensburg as a pilot.
    source: B3
  - label: Existing virtual planning
    value: BMW says Virtual Factory applications are being scaled across digital twins of more than 30 production sites.
    source: B4
  - label: Existing maintenance assistant
    value: BMW describes Factory Genius as a Dingolfing maintenance-assistant pilot intended as a basis for wider use.
    source: B5
